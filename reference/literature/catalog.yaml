  - spatial covariance between stations
  - daily rainfall distribution
  relevance: 该文证明简单 analog 在月、日降水上可与 CCA、分类树和神经网络竞争，并能保留方差与站点间协方差，因此是必须实现的非参数对照，而不是可省略的弱基线。它也为 CorrDiff+CfC
