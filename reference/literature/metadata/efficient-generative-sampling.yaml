    methods:
      - 扩散 ODE 半线性精确解
      - 指数加权积分
      - 一至三阶专用求解器
      - 自适应步长
      - 免训练少步采样
    datasets:
      - CIFAR-10
      - ImageNet 64×64
      - ImageNet 256×256
    metrics:
      - FID
      - NFE
      - 实际运行时间
      - 收敛阶数
    relevance: >-
      DPM-Solver 在约 10–20 次网络调用内保持质量且无需重训，适合作为 CorrDiff+CfC 相对 EDM-Heun 的第二阶段推理加速对照。
      其价值是减少整个时空网络的重复调用而非只优化单层；但需正确转换噪声/数据预测参数化，并重新检验确定性少步采样对集合离散度、极端事件和条件引导的影响。
    verified_at: '2026-11-23'
