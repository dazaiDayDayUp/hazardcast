    methods:
      - 幅度保持网络层
      - 激活/权重/更新量级控制
      - post-hoc EMA
      - 轻量无条件模型引导
      - 确定性少步采样
    datasets:
      - ImageNet 512×512
      - ImageNet 64×64
    metrics:
      - FID
      - NFE
      - 模型计算复杂度
      - 训练与调参成本
    relevance: >-
      EDM2 通过稳定训练动力学、事后选择 EMA 和较小无条件网络降低训练搜索及条件引导成本，可直接启发 CorrDiff+CfC 的骨干改造和廉价超参扫描。
      其重点不是进一步压缩求解步数，且结论主要来自 ADM 类 U-Net 与 ImageNet；迁移到带循环状态的 CfC、区域天气和物理约束时需重新验证幅度假设。
    verified_at: '2026-11-23'
