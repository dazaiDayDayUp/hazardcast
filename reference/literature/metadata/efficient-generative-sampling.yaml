    sha256: cff438be94fd82afe02aaee34b2fb984c92861755128259ffc136a855ef60100
    access: downloaded
    methods:
      - 确定性采样器渐进蒸馏
      - 学生-教师步数减半
      - v 参数化
      - 少步训练稳定化
    datasets:
      - CIFAR-10
      - ImageNet 64×64
      - LSUN Bedrooms 128×128
      - LSUN Churches 128×128
    metrics:
      - FID
      - 模型调用次数
      - 蒸馏训练成本
    relevance: >-
      原论文仅在 CIFAR-10、ImageNet 64×64 和 LSUN 128×128 上验证渐进蒸馏，包括把多步教师逐步压缩到少步学生；这些结果不是天气时空生成证据。
      将同一方法迁移到 CorrDiff+CfC 只是待验证方案，需要重新测量长时段、多成员生成的质量与延迟；若加入 CfC，还应蒸馏完整的时空轨迹而非孤立单帧去噪器，并检查多轮教师训练成本、学生容量及天气分布漂移下的误差累积。
    verified_at: '2026-11-23'
