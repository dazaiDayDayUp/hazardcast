    pdf_path: reference/papers/efficient-generative-sampling/karras-2022-edm.pdf
    sha256: 0cf53de9ac234366fdba08d472afa236d46edd8202fda340f579aa2db866087a
    access: downloaded
    methods:
      - EDM 模块化设计空间
      - σ 依赖预条件
      - 噪声分布与损失加权
      - Heun 二阶采样
      - σ 时间步离散化
    datasets:
      - CIFAR-10
      - ImageNet 64×64
      - FFHQ 64×64
    metrics:
      - FID
      - NFE
      - 训练能耗
    relevance: >-
      EDM 是 CorrDiff 的直接方法祖先，其预条件、噪声采样、损失加权和 Heun 求解器应拆成可独立消融的组件，而非把后续加速全部归因于 CfC。
      35 次网络调用已显著优于早期设计，但原文明确指出高分辨率参数可能需重调；天气变量尺度、极端权重和 CfC 状态耦合也会改变最适 σ 配置。
    verified_at: '2026-11-23'
