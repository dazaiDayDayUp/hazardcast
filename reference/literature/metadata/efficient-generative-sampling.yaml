    relevance: >-
      一致性函数把同一 ODE 轨迹上的任意噪声状态直接映射到数据，可把 CorrDiff+CfC 的推理推进到一至数步，并保留多步换质量的接口。
      对时序超分辨可探索跨物理时刻共享的一致性约束，但不能把轨迹自洽等同于天气动力一致性；额外训练稳定性、少步多样性和极端场误差仍是主要风险。
    verified_at: '2026-11-23'
