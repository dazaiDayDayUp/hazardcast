      - LSUN
      - LAION-400M
    metrics:
      - FID
      - PSNR
      - SSIM
      - LPIPS
      - 训练与采样计算量
    relevance: >-
      在低维天气潜空间运行 CorrDiff 和 CfC，可同时降低每步显存、序列长度与长时 rollout 成本，并按空间压缩率做系统对照。
      自编码器可能成为定量降水、极端值和精细尺度的重建瓶颈，还会引入解码开销；物理守恒与变量间关系必须在潜空间压缩前后分别评估。
    verified_at: '2026-11-23'
  - id: karras-2022-edm
    title: Elucidating the Design Space of Diffusion-Based Generative Models
