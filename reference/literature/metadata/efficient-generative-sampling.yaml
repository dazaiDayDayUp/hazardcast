  - id: ho-2020-ddpm
    title: Denoising Diffusion Probabilistic Models
    authors:
      - Jonathan Ho
      - Ajay Jain
      - Pieter Abbeel
    year: 2020
    venue: NeurIPS 2020
    doi: null
    url: https://proceedings.neurips.cc/paper/2020/hash/4c5bcfec8584af0d967f1ab10179ca4b-Abstract.html
    oa_url: https://arxiv.org/pdf/2006.11239
    pdf_path: reference/papers/efficient-generative-sampling/ho-2020-ddpm.pdf
    sha256: aee5e07a802e8dfd2a386374c94fd61d1d056cb7e1e0fec4f28e8120ff5d8505
    access: downloaded
    methods:
      - 去噪扩散概率模型
      - 加权变分下界
      - 噪声预测参数化
      - 马尔可夫反向采样
    datasets:
      - CIFAR-10
      - LSUN 256×256
    metrics:
      - FID
      - Inception Score
      - bits/dim
    relevance: >-
      DDPM 给出训练目标、噪声预测和反向链的基础对照，可用于检查 CorrDiff 残差生成器是否只是改变参数化而真正改善质量。
      但原始高质量采样依赖很长的顺序链，直接叠加 CfC 时间状态会放大显存和延迟，因此应作为精度上界而非高效方案。
    verified_at: '2026-11-23'
  - id: song-2021-ddim
    title: Denoising Diffusion Implicit Models
    authors:
      - Jiaming Song
      - Chenlin Meng
      - Stefano Ermon
    year: 2021
    venue: ICLR 2021
    doi: null
    url: https://openreview.net/forum?id=St1giarCHLP
    oa_url: https://arxiv.org/pdf/2010.02502
    pdf_path: reference/papers/efficient-generative-sampling/song-2021-ddim.pdf
    sha256: 07cb8796d7c100bf7c02bc575f16aab72c32630a8f85abd54ad45dc4f63e80fb
    access: downloaded
    methods:
      - 非马尔可夫前向过程
      - 确定性隐式采样
      - 跳步采样
      - DDIM-ODE 对应
    datasets:
      - CIFAR-10
      - CelebA 64×64
      - LSUN Bedrooms 256×256
    metrics:
      - FID
      - 采样耗时
      - 重构 MSE
    relevance: >-
      DDIM 可复用 DDPM 训练权重并以跳步、确定性轨迹减少网络调用，是 CorrDiff+CfC 最先应做的低成本推理对照。
      确定性轨迹也便于固定初始噪声比较多个时间样本和开展蒸馏，但过少步数仍有离散化误差，且可能改变集合多样性与极端天气尾部覆盖。
    verified_at: '2026-11-23'
