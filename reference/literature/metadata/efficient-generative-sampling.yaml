    sha256: b244b740e60628d01bc3d4b98d721c2343be1fb9b67ad22593c8555e66f4d4a6
    access: downloaded
    methods:
      - 连续时间 score SDE
      - 反向时间 SDE
      - probability flow ODE
      - predictor-corrector 采样
      - VE/VP/sub-VP SDE
    datasets:
      - CIFAR-10
      - CelebA-HQ 1024×1024
      - FFHQ 1024×1024
    metrics:
      - FID
      - Inception Score
      - bits/dim
      - NFE
    relevance: >-
      该框架统一随机与确定性生成轨迹，是理解 CorrDiff 的 EDM 采样、校正步和 ODE 求解器之间关系的理论底座。
      CfC 的连续时间状态可与去噪网络结合，但必须区分神经状态时间与扩散噪声时间；通用求解器仍较慢且校正器超参数较多，不能直接宣称降低天气推理成本。
    verified_at: '2026-11-23'
