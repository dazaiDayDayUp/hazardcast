  - id: chen-2020-radar-assimilation
    title: Improving Afternoon Thunderstorm Prediction over Taiwan through 3DVar-Based Radar and Surface Data Assimilation
    authors:
      - I-Han Chen
      - Jing-Shan Hong
      - Ya-Ting Tsai
      - Chin-Tzu Fong
    year: 2020
    venue: "Weather and Forecasting, 35(6), 2603-2620"
    doi: 10.1175/WAF-D-20-0037.1
    url: https://journals.ametsoc.org/view/journals/wefo/35/6/waf-d-20-0037.1.xml
    oa_url: https://journals.ametsoc.org/view/journals/wefo/35/6/waf-d-20-0037.1.pdf
    pdf_path: null
    sha256: null
    access: metadata-only
    methods:
      - WRF 3.8.1 and WRFDA 3.9.1
      - convective-scale 3DVar
      - hourly rapid update cycle
      - large-scale blending
      - radar and surface observation assimilation
    datasets:
      - seven CWA radar sites
      - 375 Taiwan surface stations
      - 579 rain gauges
      - gauge-corrected QPESUMS QPE
      - NCEP GFS 0.25-degree analysis
      - 2-km and 10-km WRF forecasts for 29 June-8 July 2017
    metrics:
      - fractions skill score with 8-km neighborhood
      - RMSE
      - mean error
      - forecast lead-time sensitivity
    relevance: >-
      该文直接解释 CWA 2-km WRF 目标场包含的区域雷达与地面资料同化信息，并证明雷达和地面观测的联合贡献及不同时段作用不同。它为台湾午后对流、冷池和出流边界评估提供物理依据，但仅有 2017 年连续 10 天和少量天气型，不能直接代表全年或台风极端表现。
    verified_at: 2026-11-23

  - id: stengel-2020-phire
    title: Adversarial super-resolution of climatological wind and solar data
    authors:
      - Karen Stengel
      - Andrew Glaws
      - Dylan Hettinger
      - Ryan N. King
    year: 2020
    venue: "Proceedings of the National Academy of Sciences, 117(29), 16805-16815"
    doi: 10.1073/pnas.1918964117
    url: https://www.pnas.org/doi/10.1073/pnas.1918964117
    oa_url: https://www.osti.gov/servlets/purl/1660090
    pdf_path: reference/papers/deterministic-downscaling/stengel-2020-phire.pdf
    sha256: 0197865d8aef70fc7e13c04f4a237909b6d4edfa303327dc2bb1d37586fb57bb
    access: existing
    methods:
      - two-stage super-resolution GAN
      - MSE pretraining
      - adversarial fine-tuning
      - fully convolutional residual network
      - 50-fold wind and 25-fold solar resolution enhancement
    datasets:
      - NREL WIND Toolkit 2-km wind
      - National Solar Radiation Database 4-km irradiance
      - NCAR CCSM CMIP5 climate simulations
    metrics:
      - relative MSE
      - turbulent kinetic energy spectra
      - velocity-gradient probability distributions and skewness
      - semivariograms
      - input-noise robustness
    relevance: >-
      该工作清楚展示逐像素 MSE 与真实小尺度统计之间的权衡，支持本项目在 MAE/RMSE 之外检查能谱、梯度和间歇性。其两级大倍率生成对 CorrDiff 的物理统计评估很有价值，但训练低分辨率场来自高分辨率资料的人工粗化，且逐时刻处理，不解决跨产品偏差或时间相干性。
    verified_at: 2026-11-23

  - id: leinonen-2021-temporal-gan
    title: Stochastic Super-Resolution for Downscaling Time-Evolving Atmospheric Fields With a Generative Adversarial Network
    authors:
      - Jussi Leinonen
      - Daniele Nerini
      - Alexis Berne
    year: 2021
    venue: "IEEE Transactions on Geoscience and Remote Sensing, 59(9), 7211-7223"
