    pdf_path: reference/papers/datasets-baselines/harder-2025-rainshift.pdf
    sha256: a69a0c8ad360a94787bbf6eda98cc493605ba5b9e8ff1705373cba99dc480d53
    access: downloaded
    methods:
      - zero-shot geographic generalization
      - deterministic ResNet
      - Wasserstein GAN with gradient penalty
      - score-based residual diffusion
      - quantile-mapping domain alignment
      - eight-member probabilistic evaluation
    datasets:
      - ERA5 0.25-degree nine-channel input
      - IMERG V07 Final Run 0.1-degree hourly precipitation
      - land-sea mask and orography
