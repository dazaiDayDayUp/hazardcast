    metrics:
      - CRPS
      - MAE for deterministic models
      - relative improvement over bilinear interpolation
      - in-distribution versus out-of-distribution performance drop
    relevance: >-
      RainShift 将时间隔离与区域隔离同时纳入基准，证明扩大训练区域并不能消除地理分布偏移，为台湾模型的跨天气型和跨地区泛化测试提供直接范式。其 2.5 倍 ERA5 到 IMERG 任务仍是逐时刻单变量降水，卫星反演误差与预印本状态也限制了结论向 2-km 多变量连续重建的直接外推。
    verified_at: 2026-11-23
