      - RMSE
    relevance: >-
      RainNet 提供少见的真实多传感器低/高分辨率配对，并以按年份留一交叉验证和 14 个基线显示视频方法在降水动力学指标上总体优于单帧方法。它可指导 CfC 时间上下文档位与运动指标设计，但仅限美国东部单变量降水，且留一年份会使用被测年份之后的数据，部署型实验还需另做前向时间划分。
    verified_at: 2026-11-23

