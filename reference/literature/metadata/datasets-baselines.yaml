    pdf_path: reference/papers/datasets-baselines/chen-2022-rainnet.pdf
    sha256: f8cc17096b5c59e68ff06928e28e55fd1295d46f96ac67d07248ef1c363fdbb3
    access: downloaded
    methods:
      - real multi-product precipitation pairing
      - implicit dynamics estimation
      - five-frame video super-resolution
      - residual-in-residual dense blocks
      - fourteen traditional and deep-learning baselines
      - seventeen-fold leave-one-year-out cross-validation
    datasets:
      - NLDAS hourly precipitation at 0.125 degree
      - NCEP Stage IV radar-gauge precipitation at 0.04 degree
      - 62424 hourly pairs over the eastern United States
      - July-November seasons from 2002 to 2018
    metrics:
      - mesoscale peak precipitation error
      - heavy rain region error
      - cumulative precipitation mean square error
      - cluster mean distance
      - heavy rain transition speed
      - average miss moving degree
