    url: https://doi.org/10.1109/TGRS.2020.3032790
    oa_url: https://arxiv.org/pdf/2005.10374
    pdf_path: reference/papers/datasets-baselines/leinonen-2021-temporal-gan.pdf
    sha256: 2df786aa20f3a7b97ba5e1fdb5d14bc8786410a7fdf93fa77c165abfcfffd3da
    access: downloaded
    methods:
      - recurrent conditional GAN
      - stochastic super-resolution
      - sixteen-fold spatial upsampling
      - temporally correlated ensemble generation
      - fully convolutional sequence generator
    datasets:
      - Swiss radar precipitation
      - GOES-16 cloud optical thickness
      - three-month radar sequence for extended rollout
    metrics:
      - RMSE
      - MS-SSIM
      - log-spectral distance
      - CRPS
      - rank histograms
      - Kolmogorov-Smirnov and Kullback-Leibler rank-distribution distances
      - outlier fraction
    relevance: >-
      这是与 CorrDiff+CfC 最直接的前置基线之一：它把随机空间超分辨与循环时间状态结合，并用集合秩统计同时检验细节与不确定度。它证明时间条件可以延长生成序列，但单变量、固定倍率和 GAN 框架尚不能回答台湾多变量中间时刻重建及跨产品系统偏差问题。
    verified_at: 2026-11-23

  - id: chen-2022-rainnet
    title: "RainNet: A Large-Scale Imagery Dataset and Benchmark for Spatial Precipitation Downscaling"
