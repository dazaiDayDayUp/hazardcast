      - Martin Hagen
      - Christoph Frei
    year: 2008
    venue: Monthly Weather Review, 136(11), 4470–4487
    doi: 10.1175/2008MWR2415.1
    url: https://journals.ametsoc.org/view/journals/mwre/136/11/2008mwr2415.1.xml
    oa_url: https://elib.dlr.de/56501/1/WernliPaulatHagenFrei2008.pdf
    pdf_path: reference/papers/evaluation-spectra-extremes/wernli-2008-sal.pdf
    sha256: 9c57faf0a824fa3894e5b069b0bf17a64c3038d95cd07cdc54a02c429dd8db9e
    access: downloaded
    methods:
      - 域内结构、振幅、位置三分解
      - 独立识别预报与观测对象而不逐对匹配
      - SAL 分布图和持久性/随机预报参照
    datasets:
      - 2001–2004 年夏季德国流域日累积降水
      - COSMO-aLMo 7 km 区域模式与 ECMWF 全球模式及观测分析
      - 合成降水场案例
    metrics:
      - Structure component S
      - Amplitude component A
      - Location component L（质心位移与对象离散度）
    relevance: SAL 能区分生成场“总雨量正确但过大过平”与“位置偏移”等常见失真，是检验 CorrDiff 随机纹理是否改变降水体形态的轻量补充。它不匹配单个对象，S 同时混合大小和峰度且依赖区域、阈值及归一化，不能替代 MODE 的对象级误差或时间连续性评估。
    verified_at: "2026-11-23"

  - id: ferro-2011-extremal
