    sha256: 132c43dddad2763e310bc2cb4d4f6511d9d011ade81245c0dd6fa4caade05f25
    access: downloaded
    methods:
      - 稀有二值事件的列联表极限性质分析
      - 对 EDS/SEDS 的可操纵性与基准率依赖修正
      - 非对称和对称极端依赖指数
    datasets:
      - 1998–2003 年苏格兰 Eskdalemuir 12 km Unified Model 6 h 降水预报
