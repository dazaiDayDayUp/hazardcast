    methods:
      - CorrDiff 式回归—扩散分解的小时级自回归 StormCast
      - 多变量功率谱与概率分布滚动评估
      - 湿上升运动和冷池的跨变量形态诊断
    datasets:
      - 美国中部 3 km HRRR 分析/预报与 1 h 状态序列
