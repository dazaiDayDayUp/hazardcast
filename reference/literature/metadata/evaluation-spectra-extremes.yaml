    metrics:
      - Extremal Dependence Index (EDI)
      - Symmetric Extremal Dependence Index (SEDI)
      - 命中率、虚警率、基准率与 ROC 等值线
    relevance: EDI/SEDI 在高阈值事件中不会像许多传统列联评分那样简单退化，可用于检查模型对极端降水或大风发生位置的判别能力，并比较不同重现期阈值。它们不衡量极端量级误差、空间结构或集合概率校准；用于 CorrDiff 集合前需明确阈值化与成员汇总方式，并按作者建议先处理预报偏差。
    verified_at: "2026-11-23"

