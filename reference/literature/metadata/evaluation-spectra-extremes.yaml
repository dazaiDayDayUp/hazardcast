    relevance: StormCast 将 FSS、逐变量频谱和湿对流跨变量形态放在同一评估框架，最直接展示如何检验生成模型是否学到公里尺度物理而不只是纹理。其物理一致性主要是少量案例的共置诊断，5 成员集合与 HRRR 确定性对照并不完全公平，且 1 h 采样无法解析许多对流内部时间过程，不能照搬为本项目的充分验证。
    verified_at: "2026-11-23"

