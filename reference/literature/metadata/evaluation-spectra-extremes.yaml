    pdf_path: reference/papers/evaluation-spectra-extremes/sundar-2025-taudiff.pdf
    sha256: 2b9cd032c3f8149bde576b8aa910a74159ba40e2809024515c359643a8ea6e2a
    access: downloaded
    methods:
      - 时序注意均值模型与小规模校正扩散组合
      - 空间谱、地点时间谱和涡度形态联合诊断
      - 平流、涡度和散度约束及极端风暴计数
    datasets:
      - 欧洲 ERA5 风场（1980–2020 训练、2021–2023 验证）
      - 偏差校正 CAM4 1° 风场及 40 年降尺度试验
      - ERA5 0.25° 到 CERRA 0.0625° 的概念验证（2011–2020 训练、2010 测试）
    metrics:
      - 空间功率谱与选点时间功率谱
      - 涡度分布和等值线形态
      - 局地风暴计数
      - 推理时间及每年数据生成成本
    relevance: TAUDiff 与 CorrDiff+CfC 的时间建模范式高度相似，提醒评估必须同时检查空间和时间频谱、涡度/散度形态及长尾风暴频次，防止单时刻谱正确而传播速度错误。其公里尺度部分仍是用低分辨率生成后接确定性 U-Net 的概念验证，极端结论主要是风暴计数而非完整极值分布，且预印本尚缺多变量观测和更严格极值统计验证。
    verified_at: "2026-11-23"
