papers:
  - id: harris-2001-multiscale
    title: Multiscale Statistical Properties of a High-Resolution Precipitation Forecast
    authors:
      - Daniel Harris
      - Efi Foufoula-Georgiou
      - Kelvin K. Droegemeier
      - Jason J. Levit
    year: 2001
    venue: Journal of Hydrometeorology, 2(4), 406–418
    doi: "10.1175/1525-7541(2001)002<0406:MSPOAH>2.0.CO;2"
    url: "https://doi.org/10.1175/1525-7541(2001)002%3C0406:MSPOAH%3E2.0.CO;2"
    oa_url: https://efi.eng.uci.edu/papers/efg_014.pdf
    pdf_path: reference/papers/evaluation-spectra-extremes/harris-2001-multiscale.pdf
    sha256: 79a2ed8c2283c4b6a84d4c3d541beb08a616db9bbfcf407a6ffb01e1ef04d9ce
    access: downloaded
    methods:
      - Fourier 功率谱的多尺度变异性诊断
      - 结构函数与矩—尺度分析
      - 雷达观测和云分辨模式的有效分辨率比较
    datasets:
      - 1999-06-03 美国南部平原风暴 NEXRAD-KAMA 2 km 雷达反射率
      - 同次风暴 ARPS 3 km 高分辨率降水预报
    metrics:
      - Fourier power spectrum
      - structure function
      - moment-scale exponent K(q)
      - 约 5 倍网格距的小尺度变异性衰减判据
    relevance: 该文把“场看起来细腻”转化为随尺度变化的方差、相关性与间歇性检验，可直接诊断 CorrDiff 是否补足回归均值丢失的高波数能量。其统计量基本不惩罚风暴相位或位置误差，因此必须与 FSS/对象指标联用；单风暴结论也不能直接当作所有天气型的固定有效分辨率。
    verified_at: "2026-11-23"

  - id: davis-2006-object
    title: "Object-Based Verification of Precipitation Forecasts. Part I: Methodology and Application to Mesoscale Rain Areas"
    authors:
      - Christopher Davis
      - Barbara Brown
      - Randy Bullock
    year: 2006
    venue: Monthly Weather Review, 134(7), 1772–1784
    doi: 10.1175/MWR3145.1
    url: https://journals.ametsoc.org/view/journals/mwre/134/7/mwr3145.1.xml
    oa_url: https://journals.ametsoc.org/view/journals/mwre/134/7/mwr3145.1.pdf
    pdf_path: null
    sha256: null
    access: metadata-only
    methods:
      - 卷积平滑与阈值分割降水对象
      - 基于质心距离的对象匹配
      - 对象几何和内部强度分布诊断
    datasets:
      - 2001 年 7–8 月美国大陆 WRF 22 km、3 h 累积降水预报
      - NCEP Stage IV 4 km 雷达—雨量计融合分析并重网格至 22 km
    metrics:
      - 对象面积、质心、轴向、纵横比和曲率
      - 对象内降水第 25/90 百分位及偏差
      - 对象 CSI、匹配率和漏报/空报对象
    relevance: MODE 的前身方法能把 CorrDiff+CfC 的错误拆成位置、面积、形状和强度，而非只报告一个像素误差，并可扩展为对象轨迹以检查时间超分辨中的传播和生消。对象定义对卷积半径、阈值、最小面积和匹配规则敏感，且原文只做同刻匹配，必须报告参数敏感性并另外设计时空追踪。
    verified_at: "2026-11-23"

  - id: roberts-2008-fss
    title: Scale-Selective Verification of Rainfall Accumulations from High-Resolution Forecasts of Convective Events
    authors:
      - Nigel M. Roberts
      - Humphrey W. Lean
    year: 2008
    venue: Monthly Weather Review, 136(1), 78–97
    doi: 10.1175/2007MWR2123.1
    url: https://doi.org/10.1175/2007MWR2123.1
    oa_url: https://centaur.reading.ac.uk/31220/1/Roberts2008a.pdf
    pdf_path: reference/papers/evaluation-spectra-extremes/roberts-2008-fss.pdf
    sha256: 422a57b5d7aa33ff46622a10e5cd4ab2eb0e2a81286a8205766b4511c26944ef
    access: downloaded
    methods:
      - 邻域超过阈值网格比例比较
      - 跨降水阈值和空间窗口的尺度选择检验
      - 以目标 FSS 定义可用技巧尺度
    datasets:
      - 2003–2004 年 10 个英国夏季对流日、40 段预报
      - Met Office Unified Model 12/4/1 km 降水预报与雷达降水
    metrics:
      - Fractions Skill Score (FSS)
      - fractions MSE 及其 skill score
      - FSS 达到 0.5+0.5f_o 时对应的最小技巧尺度
    relevance: FSS 以“多大空间尺度上仍可信”回答公里尺度降尺度最核心的问题，适合在不同阈值、提前期和物理距离窗口下比较 CorrDiff、CfC 及其组合。它主要检验邻域内事件频率而非对象强度或谱真实性，窗口增大还会牺牲锐度，不能单独用来证明生成了正确的小尺度细节。
    verified_at: "2026-11-23"

  - id: wernli-2008-sal
    title: SAL—A Novel Quality Measure for the Verification of Quantitative Precipitation Forecasts
    authors:
      - Heini Wernli
