    pdf_path: "reference/papers/spatiotemporal-architectures/leguen2020phydnet.pdf"
    sha256: "bd40c74d1191881d114eabf278fb8837fda48f3742de373c143492742291f638"
    access: downloaded
    methods:
      - PhyDNet 双分支解耦
      - PhyCell 潜空间 PDE 约束递归
      - 物理分支与残差分支
      - 数据同化式预测—校正
    datasets:
      - Moving MNIST
      - Traffic BJ
      - Sea Surface Temperature (SST)
      - Human3.6M
    metrics:
      - MSE
      - MAE
      - SSIM
      - 长时预测误差
