    relevance: "PredRNN 将层间空间记忆和层内时间记忆显式分流，为 CfC 隐状态与 CorrDiff 多尺度特征之间如何交换信息提供了结构参照。雷达回波实验增强了项目相关性，但逐步串行计算成本较高，双记忆仍是离散更新，且长滚动预测会累积平滑与误差。"
    verified_at: 2026-11-23

  - id: leguen2020phydnet
    title: "Disentangling Physical Dynamics From Unknown Factors for Unsupervised Video Prediction"
    authors:
