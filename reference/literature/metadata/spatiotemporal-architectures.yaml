    relevance: "PhyDNet 是本项目物理增强最直接的结构参照：可让物理分支承担已知输运或守恒倾向，让 CfC 或轻量残差分支表达未建模过程，并做分支消融。其 PhyCell 学习的是通用微分算子组合而非大气控制方程，不能据此声称满足真实天气物理，仍需独立检查守恒和极端事件。"
    verified_at: 2026-11-23

