    relevance: "ConvLSTM 是把格点天气序列的空间结构与递归状态统一起来的奠基基线，可直接与相同编码器和解码器下的 CfC 时间核心比较。它适合检验连续时间单元是否真正优于离散递归，但局部卷积感受野、固定时间步和确定性输出不能单独解决跨尺度传播与小时段内高频重建。"
    verified_at: 2026-11-23

