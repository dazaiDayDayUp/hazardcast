    relevance: 该文展示了以 CRPS 直接学习非线性分布参数、融合辅助变量和位置嵌入的后处理路线，可转化为 CorrDiff+CfC 的轻量网格校准器。它能隔离“生成模型本身”和“后处理”带来的增益，但单站 2-m 温度实验没有解决联合场、降水零膨胀和跨时刻一致性。
    verified_at: 2026-11-23

  - id: price-2025-gencast
    title: Probabilistic weather forecasting with machine learning
    authors:
      - Ilan Price
      - Alvaro Sanchez-Gonzalez
      - Ferran Alet
      - Tom R. Andersson
      - Andrew El-Kadi
      - Dominic Masters
      - Timo Ewalds
      - Jacklynn Stott
      - Shakir Mohamed
      - Peter Battaglia
      - Remi Lam
      - Matthew Willson
    year: 2025
    venue: Nature 637(8044), 84-90
    doi: 10.1038/s41586-024-08252-9
    url: https://www.nature.com/articles/s41586-024-08252-9
    oa_url: https://www.nature.com/articles/s41586-024-08252-9.pdf
    pdf_path: reference/papers/weather-generative/price-2025-gencast.pdf
    sha256: 2af6b1493f3f357b68d5195bcae8d3c9578b8daed7dec02c1bb101c5f8eaedb7
    access: existing
    methods:
      - conditional diffusion ensemble forecasting
      - autoregressive 12-h rollout
      - ERA5 EDA initial-condition perturbations
      - joint spatiotemporal weather-trajectory sampling
    datasets:
      - ERA5 reanalysis (1979-2018 training) and ERA5 EDA
      - ECMWF ENS and GraphCast-Perturbed baselines
      - global surface and upper-air variables, tropical cyclones and wind-power cases
    metrics:
      - CRPS and CRPS skill score
      - ensemble-mean RMSE
      - spread-skill ratio
      - rank histogram
      - Brier skill score and extreme-event skill
    relevance: GenCast 是与 CorrDiff 最接近的近期生成式集合参照，证明随机扩散样本可以同时改善边际技巧、校准和有物理质感的时空轨迹。其全球中期预报与公里尺度区域时空超分辨任务不同，且大模型训练成本高；可迁移的是多随机轨迹、分时效 CRPS 和 spread/rank 联合评估，而非直接比较绝对分数。
    verified_at: 2026-11-23
