    oa_url: https://arxiv.org/pdf/1805.09091
    pdf_path: reference/papers/probabilistic-calibration/rasp-2018-neural-postprocessing.pdf
    sha256: feecf0118a39c5ba02fc0be7f676613c1a18c86c881f8c645494623f3ddedd18
    access: downloaded
    methods:
      - neural distributional regression
      - CRPS minimization
      - auxiliary ensemble predictors
      - station embeddings
      - comparison with EMOS benchmarks
    datasets:
      - TIGGE ECMWF 50-member 48-h 2-m temperature forecasts (2007-2016)
      - 537 DWD surface stations in Germany; 2016 held out for validation
