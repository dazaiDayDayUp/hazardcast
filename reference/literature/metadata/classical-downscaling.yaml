    metrics:
      - mean annual precipitation and temperature bias
      - precipitation magnitude probability distributions
      - annual maximum daily precipitation and extreme-event counts
      - interannual variability
      - projected climate-change signal across methods and predictor sets
    relevance: En-GARD 将 analog、回归、事件发生概率和时空相关随机场采样合成开源概率基线，是与 CorrDiff 集合生成和 CfC 时间依赖比较的最新经典参照。其预测因子消融显示历史均值拟合相近却可产生不同未来变化，直接支持本项目检验物理变量和极端外推；但逐格点日尺度后处理及简化相关随机场并未学习完整的连续时间动力轨迹。
    verified_at: "2026-11-23"
