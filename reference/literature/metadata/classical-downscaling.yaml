    sha256: 10814e42152f8b1fa7faa9cb9e2f9faaf61f5204c26aab07633378bc2c40a502
    access: downloaded
    methods:
      - pure regression, pure analog and analog-regression
      - logistic regression for event occurrence
      - threshold-dependent magnitude prediction
      - residual-based ensemble sampling
      - spatiotemporally correlated random fields
    datasets:
      - Maurer et al. 1/8-degree daily CONUS precipitation and temperature observations
      - ERA-Interim for 1979-2015
      - six CMIP5 GCMs for 1950-2100
