topic: continuous-time-cfc
papers:
  - id: chen2018neural-ode
    title: Neural Ordinary Differential Equations
    authors:
      - Ricky T. Q. Chen
      - Yulia Rubanova
      - Jesse Bettencourt
      - David Duvenaud
    year: 2018
    venue: Advances in Neural Information Processing Systems 31 (NeurIPS 2018)
    doi: null
    url: https://proceedings.neurips.cc/paper/2018/hash/69386f6bb1dfed68692a24c8686939b9-Abstract.html
    oa_url: https://proceedings.neurips.cc/paper_files/paper/2018/file/69386f6bb1dfed68692a24c8686939b9-Paper.pdf
    pdf_path: reference/papers/continuous-time-cfc/chen2018neural-ode.pdf
    sha256: fe6fae5c828a11d0347c04bc9fa765091df9551a85e6fa891980bfcae8d9ffce
    access: downloaded
    methods:
      - Neural ODE
      - adjoint sensitivity method
      - continuous normalizing flow
      - latent variable model
    datasets:
      - MNIST
      - Two Circles
      - Two Moons
      - synthetic bidirectional spirals
    metrics:
      - test accuracy
      - negative log-likelihood
      - KL divergence
      - predictive RMSE
      - number of function evaluations
      - memory usage
    relevance: >-
      为在低分辨率条件序列中定义连续潜状态、在任意目标时刻查询高分辨率场提供统一数学基础，伴随法也便于嵌入大型 CorrDiff 条件网络。其数值求解成本、误差与刚性天气动力学的训练稳定性是主要限制，不能把“连续时间”直接等同于物理一致。
    verified_at: '2026-11-23'

  - id: rubanova2019latent-ode
    title: Latent Ordinary Differential Equations for Irregularly-Sampled Time Series
    authors:
      - Yulia Rubanova
      - Ricky T. Q. Chen
      - David K. Duvenaud
    year: 2019
    venue: Advances in Neural Information Processing Systems 32 (NeurIPS 2019)
    doi: null
