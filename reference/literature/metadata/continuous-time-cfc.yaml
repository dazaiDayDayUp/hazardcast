      GRU-ODE 与贝叶斯观测更新交替，为不规则低时频输入的“传播—校正”提供直接基线，且原文含 USHCN 气候预测实验。逐观测调用 ODE 求解器会限制公里尺度长序列吞吐，其气候实验也不是空间降尺度。
    verified_at: '2026-11-23'

  - id: li2020neural-sde
