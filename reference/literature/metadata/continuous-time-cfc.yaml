    relevance: >-
      可从稀疏低时频观测推断整条潜轨迹并给出不确定性，适合作为 CorrDiff 之前的概率时间编码器。纯 ODE 轨迹由初值决定且依赖编码器，对持续到达的新观测和空间极端事件的适应性有限。
    verified_at: '2026-11-23'

  - id: debrouwer2019gru-ode-bayes
