      该研究把确定性 UNet 的可预测均值与残差 cGAN 的高频扰动分开，并用强度约束使对抗损失权重跨两个数量级仍保持稳健，为 CorrDiff+CfC 的“确定骨架加生成残差”与物理损失设计提供近期强参照。其价值主要在气候统计和极端事件而非确定时刻逐点复原；日尺度新西兰实验未解决连续时间插值，集合校准还随架构改变，需避免把视觉真实或分布改善等同于逐事件正确。
