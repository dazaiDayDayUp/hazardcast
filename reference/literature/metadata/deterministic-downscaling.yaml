      该研究提供了比单一模型结果更可信的 VALUE 对照框架，说明 CNN 对降水多数统计特征有增益，而温度上的非线性增益主要出现在极端值，复杂拓扑反而可能过拟合。其暖期留出和持续期、极端值、年循环指标非常适合迁移到 CWA 数据，但同一时刻的 perfect-prognosis 设置没有回答稀疏时间输入下的动力连续性问题，CfC 仍需单独的时间基线。
