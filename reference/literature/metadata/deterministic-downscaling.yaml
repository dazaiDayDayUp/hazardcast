      DeepSD 是把单图像超分辨系统引入气候统计降尺度的奠基工作，其堆叠 SRCNN、多尺度高程输入和 BCSD/传统机器学习对照可直接构成本项目的经典 CNN 基线。它证明空间邻域先验有效，但输入来自同一 PRISM 场的粗化而非真实跨模式序列，且作者明确承认未检验地域迁移、非平稳性和不确定性，因此不能替代时空泛化实验。
