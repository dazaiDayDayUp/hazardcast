      - "单随机森林与双随机森林"
      - "粗细网格协变量与 dry drift"
      - "双线性插值对照"
    datasets:
      - "NLDAS-2 小时 gauge-radar 降水，0.125°"
      - "美国 SWUS、CUS、NEUS、SEUS 四个气候区"
