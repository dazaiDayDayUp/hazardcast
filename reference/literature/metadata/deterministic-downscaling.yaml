    relevance: >-
      Prec-DWARF 是非深度、非参数降尺度的重要强对照，可检验 CorrDiff+CfC 是否真正超过利用邻域降水、地形和干湿距离的随机森林，而不是只超过插值。双森林虽改善极端降水，但仍显著低估时空变率，这提示本项目必须同时报告强度分布和 variogram，不能只看 RMSE；其逐网格协变量回归也不能直接解决连续时间重建。
    verified_at: "2026-11-23"

