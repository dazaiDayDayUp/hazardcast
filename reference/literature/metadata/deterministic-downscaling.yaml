    relevance: >-
      这是与 CfC 结合最直接的前驱之一：ConvGRU 把高分辨隐藏状态随低分辨序列递推，并用随机集合表达不可恢复细节，同时以谱距离、CRPS 和 rank 统计检验时空真实性与校准。它只做固定 10 min 间隔的 16 倍空间增强，未提高时间分辨率，长时递推还可能出现伪影；CfC 的价值应明确落在连续/不规则时间条件、稳定长序列和中间时刻重建，而非笼统声称优于 RNN。
    verified_at: "2026-11-23"

