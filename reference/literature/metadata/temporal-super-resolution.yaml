    doi: 10.1016/j.jcp.2023.112438
    url: https://doi.org/10.1016/j.jcp.2023.112438
    oa_url: https://arxiv.org/pdf/2208.01462
    pdf_path: reference/papers/temporal-super-resolution/ren-2023-physr.pdf
    sha256: fccd6e5e3f6c901554faaa4229d17a4343ae3c97e9caee8366b8fc1ed29e1cb4
    access: downloaded
    methods:
      - 时间插值与 ConvLSTM 时间细化
      - 低分辨率潜空间残差特征提取和 PixelShuffle 空间重建
      - 高阶有限差分 PDE 残差软约束
      - Dirichlet、Neumann 与周期边界硬编码
    datasets:
      - 二维 Rayleigh-Bénard 对流
      - 二维 Gray-Scott 反应扩散系统
      - 三维 Gray-Scott 反应扩散系统
    metrics:
      - 相对全场 L2 误差
      - 可训练参数量
      - 训练时间与推理时间
    relevance: >-
      PhySR 给出了“插值初值—循环时间细化—空间超分辨—物理修正”的清晰模块化路线，可将 ConvLSTM 替换为 CfC、将空间重建替换为 CorrDiff 形成物理增强基线。
      其边界硬编码和有限差分残差值得借鉴，但已知 PDE、规则网格和较密时间步的假设较强，物理软损失还存在权重调节困难，且未在观测天气场上验证。
    verified_at: "2026-11-23"

