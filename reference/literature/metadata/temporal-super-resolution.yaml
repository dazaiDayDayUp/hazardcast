    relevance: >-
      这是与 CfC 条件均值加 CorrDiff 残差生成最直接对应的近期工作，同时把倍率适配、质量守恒和概率校准放入同一实验框架。
      主要倍率组合仍分别训练且不共享权重；例外是邻近目标可先用轻量插值对齐到最近的已学习分辨率，再复用对应模型，但这并非任意倍率的零样本权重共享。
      其结果提醒确定性模型可在逐点指标上更好而扩散模型改善谱和 CRPS；像素尺度集合欠离散，1000 步采样昂贵，且目前仍是预印本。
