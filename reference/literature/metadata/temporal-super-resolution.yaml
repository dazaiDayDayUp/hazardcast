    sha256: bbf6ce3f83c1cb99855842825b90aaeae5b1f22eb1ebb491168d09b8442e8e5d
    access: downloaded
    methods:
      - 双向光流估计与中间时刻光流细化
      - U-Net 可见性图、双向 warping 与自适应融合
      - 可变长度多帧插值
      - 重建、感知、warping 与平滑联合损失
    datasets:
      - Adobe240-fps 与 YouTube240-fps（1132 段训练视频）
