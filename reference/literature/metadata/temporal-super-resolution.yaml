      该文确立了由两个已知端点按目标时刻并行生成任意数量中间帧的经典范式，可作为 CfC 连续时间重建的确定性光流对照。
      其运动边界与遮挡处理有助于设计平流天气场基线，但自然视频的亮度恒常假设、单帧确定输出和缺乏守恒约束不能直接处理降水生消及多变量物理耦合。
