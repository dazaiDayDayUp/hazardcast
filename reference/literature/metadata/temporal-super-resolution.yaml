      - 多变量、任意长度联合轨迹采样
      - 空间面积平均和时间抽稀构成观测算子
      - 后验条件化与分位数映射偏差校正
    datasets:
      - COSMO-REA6 约 6 km、1 小时再分析（2006-2014）
      - 10 m 双向风、2 m 温度与海平面气压
      - CMIP6 MPI-ESM1.2-HR 与 HadGEM3-GC3.1-LM（约 100 km、6 小时）
      - 欧洲区域 16 倍空间、6 倍时间联合降尺度
    metrics:
      - 概率积分变换 PIT 校准
      - 功率谱密度
      - 变量值分布与极端分位数
      - 集合轨迹的时空一致性与分布覆盖
    relevance: >-
      该框架把 CorrDiff 类扩散模型作为高分辨率时空联合先验，再用稀疏粗场观测算子约束后验，避免逐时刻独立生成造成的变量和时间不一致。
      分变量 PIT 并不都平坦：两个风速分量校准较好，海平面气压略欠自信且过多预测极端值，地表温度分布略窄且低估尾部事件，因此整体校准不能替代逐变量诊断。
      这为 CfC 提供两种角色：学习潜状态动力学或构造后验条件；主要代价是整条多变量轨迹的显存与采样开销，当前仅验证小区域，且物理规律只是数据中的隐式先验而非严格约束。
    verified_at: "2026-11-23"

