    relevance: >-
      该文直接比较空间与时间超分辨的先后顺序，为“先 CfC 时间重建还是先 CorrDiff 空间降尺度”提供了必须保留的分解式对照。
      结果同时表明可重建性受端点时间相关性控制，且 L2 模型偏向低波数；但实验限于少数 DNS 流场和确定性监督，尚不能说明真实天气跨 regime 泛化或概率重建能力。
