name: corrdiff-official-validation
paths:
  project: ???
  upstream: ???
  dataset: ???
  run: ???

# 使用 NGC 正式权重进行论文表 1 评估，不执行训练。
times: ???
ensemble_members: 32
denoising_steps: 18

example: ${paths.upstream}/examples/weather/corrdiff
pretrained: ${paths.project}/pretrained/corrdiff-ngc-v1
compatible: ${paths.run}/compatibility/models
regression_checkpoint: ${compatible}/regression.mdlus
diffusion_checkpoint: ${compatible}/diffusion.mdlus
samples: ${paths.run}/sampling/samples.nc
metrics: ${paths.run}/evaluation/metrics.nc

stages:
  - name: compatibility
    script: ${paths.project}/scripts/convert_corrdiff.py
    args: ["${pretrained}", "${compatible}"]
    outputs:
      - "${regression_checkpoint}"
      - "${diffusion_checkpoint}"
      - "${compatible}/转换记录.json"
  - name: sampling
    nproc_per_node: ${world_size}
    script: ${example}/generate.py
    args:
      - --config-name=config_generate_taiwan
      - dataset.data_path=${paths.dataset}
      - generation.io.reg_ckpt_filename=${regression_checkpoint}
      - generation.io.res_ckpt_filename=${diffusion_checkpoint}
      - ++generation.io.output_filename=${samples}
      - generation.num_ensembles=${ensemble_members}
      - generation.seed_batch_size=4
      - generation.hr_mean_conditioning=false
      - generation.perf.use_fp16=false
      - generation.perf.use_torch_compile=false
      - generation.times=${times}
      - sampler.num_steps=${denoising_steps}
      - hydra.run.dir=.
    outputs: ["${samples}"]
  - name: evaluation
    script: ${paths.project}/scripts/score_ensemble.py
    args: ["${samples}", "${metrics}", --time-list, "${time_list}"]
    outputs: ["${metrics}"]
